<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000">
  <title>مقفولة</title>
  <style>
    html,body{margin:0;height:100%;background:#000;color:#fff;font-family:sans-serif}
    .box{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
    h1{font-size:clamp(28px,8vw,52px);margin:0 0 18px;line-height:1.4}
    p{font-size:clamp(18px,5vw,28px);color:#ff4d4d;line-height:1.8;margin:0}
  </style>
</head>
<body>
  <div class="box">
    <div>
      <h1>اللعبة مقفولة</h1>
      <p>بسبب عدم التقدير والاحترام</p>
    </div>
  </div>
</body>
</html>
