<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0d14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>khood community</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { colors: { neon: { cyan:'#00f3ff', pink:'#ff007f', purple:'#a855f7', green:'#39ff14', dark:'#0a0d14', card:'#121826', border:'#1f293d' } }, fontFamily: { cairo: ['Cairo','sans-serif'] } } } };
  </script>
  <style>
    body { font-family: Cairo, sans-serif; background:#080b11; color:#f3f4f6; }
    .glass { background: rgba(18,24,38,.9); border: 1px solid rgba(0,243,255,.18); }
    .bubble-me { background:#005c4b; }
    .bubble-them { background:#202c33; }
    #callScreen { display:none; }
    #callScreen.on { display:block; }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">
  <div id="loginModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90">
    <div class="glass w-full max-w-md rounded-3xl p-6 text-center">
      <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 to-pink-400 mb-1">khood community</h1>
      <p class="text-xs text-cyan-300 mb-4">نفس شخصيات اللعبة. اختار مين إنت وكلمة السر ثابتة.</p>
      <div id="whoGrid" class="grid grid-cols-5 gap-2 mb-4"></div>
      <input id="passIn" type="password" placeholder="كلمة سر الشخصية" class="w-full mb-3 px-4 py-3 rounded-2xl bg-neon-card border border-neon-border text-white text-center">
      <button id="loginBtn" class="w-full py-3 rounded-2xl bg-gradient-to-r from-cyan-400 to-pink-500 text-black font-black">دخول</button>
      <p id="loginErr" class="text-red-400 text-sm mt-3"></p>
      <a href="./index.html" class="block mt-4 text-cyan-300 text-sm">رجوع للعبة</a>
    </div>
  </div>

  <header class="h-16 glass px-4 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-3">
      <img id="meFace" src="./sisi.png" class="w-10 h-10 rounded-xl object-cover">
      <div>
        <b class="block">khood community</b>
        <small id="meName" class="text-gray-400">—</small>
      </div>
    </div>
    <div class="flex gap-2">
      <button id="instBtn" class="px-3 py-2 rounded-xl bg-cyan-800 text-xs">ثبّت</button>
      <a href="./index.html" class="px-3 py-2 rounded-xl bg-neon-card text-xs">اللعبة</a>
      <button id="outBtn" class="px-3 py-2 rounded-xl bg-red-900 text-xs">خروج</button>
    </div>
  </header>

  <div class="flex-1 flex overflow-hidden">
    <aside id="sideList" class="w-full md:w-80 border-l border-neon-border bg-neon-card/80 flex flex-col">
      <div class="p-3 border-b border-neon-border">
        <p id="stat" class="text-xs text-cyan-300 mb-2">مش ظاهر</p>
        <button id="grpBtn" class="w-full mb-2 py-2 rounded-xl bg-pink-700 text-xs">جروب الشلة</button>
        <div id="people" class="space-y-1 overflow-y-auto"></div>
      </div>
    </aside>
    <main id="chatMain" class="hidden md:flex flex-1 flex-col bg-neon-dark">
      <div id="threadHead" class="h-16 glass px-4 flex items-center gap-3">
        <button id="threadBack" type="button" class="px-2 text-lg">›</button>
        <img id="youFace" src="./sisi.png" class="w-10 h-10 rounded-full object-cover">
        <div class="flex-1">
          <b id="youName">اختار حد</b>
          <small id="youSeen" class="block text-gray-400 text-xs">آخر ظهور</small>
          <small id="youType" class="block text-green-400 text-xs h-4"></small>
        </div>
        <button id="callBtn" class="px-2 py-1 text-xs rounded-lg bg-green-700">صوت</button>
        <button id="vidBtn" class="px-2 py-1 text-xs rounded-lg bg-cyan-800">فيديو</button>
        <button id="invBtn" class="px-2 py-1 text-xs rounded-lg bg-pink-800">دعوة لعب</button>
      </div>
      <div id="log" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
      <form id="sendForm" class="p-3 glass flex gap-2">
        <button type="button" id="recBtn" class="w-11 h-11 rounded-2xl bg-pink-700 text-white">🎤</button>
        <input id="msgIn" class="flex-1 px-4 py-2 rounded-2xl bg-neon-card border border-neon-border" placeholder="رسالة">
        <button class="w-11 h-11 rounded-2xl bg-cyan-400 text-black"><i class="fa-solid fa-paper-plane"></i></button>
      </form>
    </main>
  </div>

  <div id="inCall" class="fixed inset-0 z-40 hidden items-center justify-center bg-black/80">
    <div class="glass rounded-3xl p-6 text-center w-72">
      <img id="inFace" src="./sisi.png" class="w-20 h-20 rounded-full mx-auto mb-3 object-cover">
      <p id="inName">مكالمة داخلة</p>
      <div class="flex gap-3 justify-center mt-4">
        <button id="accBtn" class="px-4 py-2 rounded-xl bg-green-600">قبول</button>
        <button id="rejBtn" class="px-4 py-2 rounded-xl bg-red-600">رفض</button>
      </div>
    </div>
  </div>
  <div id="callScreen" class="fixed inset-0 z-50 bg-black">
    <div id="tiles" class="absolute inset-0 grid grid-cols-1 sm:grid-cols-2 place-items-center gap-2 p-3 pt-12 pb-32"></div>
    <div id="voicePad" class="absolute inset-0 flex flex-col items-center justify-center gap-3 pointer-events-none">
      <img id="voiceFace" src="./sisi.png" class="w-36 h-36 rounded-full object-cover">
      <b id="voiceWho" class="text-xl">مكالمة</b>
    </div>
    <video id="vidMe" autoplay muted playsinline class="absolute left-1/2 -translate-x-1/2 bottom-28 w-[46vw] max-w-[280px] h-[34vh] max-h-[320px] object-cover rounded-2xl bg-black border-2 border-white/40"></video>
    <video id="vidYou" autoplay playsinline class="hidden"></video>
    <p id="callStat" class="absolute top-5 left-4 text-sm">جاري الاتصال...</p>
    <div class="absolute bottom-8 inset-x-0 flex justify-center gap-3">
      <button id="muteBtn" class="w-14 h-14 rounded-full bg-gray-700">كتم</button>
      <button id="camBtn" class="w-14 h-14 rounded-full bg-gray-700">كاميرا</button>
      <button id="spkBtn" class="w-14 h-14 rounded-full bg-gray-700">صوت</button>
      <button id="hangBtn" class="w-14 h-14 rounded-full bg-red-600">قفل</button>
    </div>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="./data.js"></script>
  <script src="./store.js"></script>
  <script src="./messenger.js"></script>
</body>
</html>
